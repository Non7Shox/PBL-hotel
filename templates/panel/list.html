{% extends 'panel/base.html' %}
{% block panel %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="mb-0">{{ config.title }}</h1>
  <a class="btn btn-copper btn-sm" href="{% url 'panel:add' section %}">+ Добавить</a>
</div>
<div class="panel-card"><div class="table-responsive"><table class="data-table">
  <thead><tr>{% for column in config.columns %}<th>{{ column }}</th>{% endfor %}<th></th></tr></thead>
  <tbody>{% for pk, cells in rows %}<tr>
    {% for cell in cells %}<td>{{ cell }}</td>{% endfor %}
    <td class="text-end text-nowrap">
      <a class="btn btn-outline-copper btn-sm" href="{% url 'panel:edit' section pk %}">Изменить</a>
      <a class="btn btn-outline-copper btn-sm" href="{% url 'panel:delete' section pk %}" aria-label="Удалить"><i class="ph ph-trash"></i></a>
    </td>
  </tr>{% empty %}<tr><td colspan="8">Пока пусто.</td></tr>{% endfor %}</tbody>
</table></div></div>
{% endblock %}
